package:
  name: cuda-arch
  version: ${{ compute_capability }}

source:
  url: https://developer.download.nvidia.com/compute/cuda/redist/cuda_documentation/LICENSE.txt
  sha256: e2c71babfd18a8e69542dd7e9ca018f9caa438094001a58e6bc4d8c999bf0d07

build:
  # Add new versions to conda_build_config.yaml; only update the build number if
  # dependencies change. This build number should remain less than or equal to the build
  # number on the main branch.
  number: 3
  noarch: generic
  string: cuda${{ first_supported_toolkit }}_h${{ hash }}_${{ build_number }}

requirements:
  run_exports:
    - cuda-arch >=${{ compute_capability }}
  run:
    # This is a special variant of the cuda-arch package which depends on __cuda and
    # cuda-version instead of __cuda_arch. Its purpose is to round some hard edges in the
    # transition period when packages start to depend on __cuda_arch, but conda packge
    # managers have not yet implemented support for __cuda_arch. It allows users without
    # __cuda_arch to install cuda-arch by constraining them to the oldest arch supported by
    # the cuda-version of their environment.
    - __cuda
    - cuda-version ${{ first_supported_toolkit }}.*
  run_constraints:
    # If __cuda_arch IS available, DO NOT use this variant. This constraint prevents the
    # solver from promoting cuda-arch<7.5 devices with a 580-series driver to CUDA 13 and
    # cuda-arch=7.5
    - __cuda_arch <0.0a0

tests:
  - script:
      - exit 0

about:
  homepage: https://developer.nvidia.com/cuda-toolkit
  summary: "A meta-package that pins a minimum supported CUDA architecture"
  description: >
    The cuda-arch package represents a minimum supported target CUDA architecture / compute
    capability. Depending on this package declares that a CUDA device with at least the
    declared compute capability is required.

    Similar to how the cuda-version package is constrained by the __cuda virtual package,
    the cuda-arch package requires the __cuda_arch virtual package. The __cuda_arch
    virtual package provides the minimum compute capability of the available CUDA devices
    detected on the system. The cuda-arch package allows packages to express a minimum
    supported compute capability without depending on __cuda_arch directly.
  license: LicenseRef-NVIDIA-End-User-License-Agreement
  license_file: LICENSE.txt

extra:
  feedstock-name: cuda-arch
  recipe-maintainers:
    - conda-forge/cuda
